name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP: ${{ github.event.inputs.bump || 'patch' }}
      BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip pushes that do not change the binary
        id: changed
        if: github.event_name == 'push'
        run: |
          # engines.json is embedded in the binary, so it releases; fixtures, docs and CI do not
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BEFORE" HEAD | grep -vE '^bench/fixtures/|\.md$|^docs/|^\.github/' || true)
          if [ -z "$files" ]; then
            echo "only fixtures, docs or CI changed: no release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Tag and release
        if: steps.changed.outputs.release != 'false'
        run: .github/release.sh "$BUMP"
